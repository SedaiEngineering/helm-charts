name: Release Docs

# Regenerates release-docs/components.md (what each `<component>.enabled` toggle installs) when the
# chart changes. Runs on the dev, edge and main channels; the same file is cherry-picked to all three.
#   dev, edge: commits the file straight back to the branch when it changed.
#   main:      the ruleset blocks direct pushes, so it force-pushes the file to `release-docs/main`
#              and opens (or reuses) a PR to main. PRs opened with GITHUB_TOKEN don't trigger
#              workflows, so the required check doesn't start on its own: merge with admin bypass,
#              or close and reopen the PR to run it.
# Pushes and PRs made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
on:
  workflow_dispatch:
  push:
    branches: [dev, edge, main]
    paths:
      - 'charts/sedai-smart-agent/**'
      - '.github/scripts/component-matrix.sh'
      - '.github/workflows/release-docs.yaml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-docs-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  components:
    name: Generate component matrix
    if: contains(fromJSON('["dev", "edge", "main"]'), github.ref_name)
    runs-on: sedai-arc-helm-charts
    env:
      BRANCH: ${{ github.ref_name }}
      DOCS_BRANCH: release-docs/${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Generate release-docs/components.md
        run: .github/scripts/component-matrix.sh charts/sedai-smart-agent release-docs/components.md

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet --exit-code -- release-docs/ && [ -z "$(git ls-files --others --exclude-standard release-docs/)" ]; then
            echo "release-docs/components.md is up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-docs/
          git commit -m "docs: regenerate release-docs/components.md"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push to ${{ github.ref_name }}
        if: steps.commit.outputs.changed == 'true' && github.ref_name != 'main'
        run: |
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Push to release-docs/main
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        run: git push --force origin "HEAD:refs/heads/$DOCS_BRANCH"

      - name: Open PR to main
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = process.env.DOCS_BRANCH;
            const { data: open } = await github.rest.pulls.list({ owner, repo, base: 'main', head: `${owner}:${head}`, state: 'open' });
            if (open.length) {
              core.info(`Updated existing PR #${open[0].number}: ${open[0].html_url}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, base: 'main', head,
              title: 'docs: regenerate release-docs/components.md',
              body: [
                `Regenerated by the **Release Docs** workflow after ${context.sha.slice(0, 7)} changed the chart on \`main\`.`,
                '',
                'Only `release-docs/components.md` changes. This PR was opened with `GITHUB_TOKEN`, so the required check does not start on its own: merge with admin bypass, or close and reopen the PR to run it.',
              ].join('\n'),
            });
            core.info(`Opened PR #${pr.number}: ${pr.html_url}`);
