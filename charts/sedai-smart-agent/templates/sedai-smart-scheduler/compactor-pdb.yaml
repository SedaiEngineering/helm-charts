{{- if and (eq (include "smart-scheduler.installOk" .) "true") .Values.sedaiSmartScheduler.compactor.enabled .Values.sedaiSmartScheduler.compactor.disruptionProtection -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.workload.smartCompactor.name | default "sedai-smart-compactor" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-scheduler.labels" . | nindent 4 }}
spec:
  # See sedai-smart-scheduler/pdb.yaml for why the shape depends on replica count.
  {{- if le (int .Values.sedaiSmartScheduler.compactor.replicas) 1 }}
  minAvailable: 1
  {{- else }}
  maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      app: sedai-smart-compactor
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
