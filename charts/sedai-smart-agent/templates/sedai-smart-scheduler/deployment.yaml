{{- if eq (include "smart-scheduler.installOk" .) "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-scheduler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-scheduler.labels" . | nindent 4 }}
    app: sedai-smart-scheduler
spec:
  replicas: {{ .Values.sedaiSmartScheduler.replicaCount }}
  # Surge first: a replica that cannot start (bad image or config) stalls the rollout while the old ones keep serving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sedai-smart-scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "smart-scheduler.selectorLabels" . | nindent 8 }}
        app: sedai-smart-scheduler
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/sedai-smart-scheduler/configmap.yaml") . | sha256sum }}
        {{- if .Values.sedaiSmartScheduler.disruptionProtection }}
        karpenter.sh/do-not-disrupt: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ include "smart-scheduler.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.sedaiSmartScheduler.podSecurityContext | nindent 8 }}
      containers:
        - name: kube-scheduler
          image: "{{ include "sedai-smart-agent.imageRepository" (dict "globalRegistry" .Values.globalRegistry "repository" .Values.image.scheduler.repository) }}:{{ include "smart-scheduler.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.scheduler.imagePullPolicy }}
          command:
            - kube-scheduler
            - --config=/etc/kubernetes/scheduler-config.yaml
            - --v={{ .Values.sedaiSmartScheduler.scheduler.verbosity }}
          ports:
            - name: https
              containerPort: 10259
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 10259
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ include "smart-scheduler.readyPath" . }}
              port: 10259
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.scheduler | nindent 12 }}
          securityContext:
            {{- toYaml .Values.sedaiSmartScheduler.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes
              readOnly: true
        - name: log-forwarder
          image: "{{ include "sedai-smart-agent.imageRepository" (dict "globalRegistry" .Values.globalRegistry "repository" .Values.image.logForwarder.repository) }}:{{ .Values.image.logForwarder.imageTag }}"
          imagePullPolicy: {{ .Values.image.logForwarder.imagePullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONTAINER_NAME
              value: kube-scheduler
            - name: CONTAINER_LABEL
              value: sedai-smart-scheduler
            - name: AGENT_TENANT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.workload.smartAgent.secret }}
                  key: AGENT_TENANT
                  optional: true
            - name: AGENT_ACCOUNTID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.workload.smartAgent.secret }}
                  key: AGENT_ACCOUNTID
                  optional: true
          securityContext:
            {{- toYaml .Values.sedaiSmartScheduler.securityContext | nindent 12 }}
          volumeMounts:
            - name: sidecar-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "smart-scheduler.fullname" . }}-config
        - name: sidecar-tmp
          emptyDir: {}
      {{- with .Values.sedaiSmartScheduler.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.sedaiSmartScheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sedaiSmartScheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $multi := gt (int .Values.sedaiSmartScheduler.replicaCount) 1 }}
      {{- with .Values.sedaiSmartScheduler.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- if $multi }}
      topologySpreadConstraints:
        {{- range list "topology.kubernetes.io/zone" "kubernetes.io/hostname" }}
        - maxSkew: 1
          topologyKey: {{ . }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sedai-smart-scheduler
              app.kubernetes.io/instance: {{ $.Release.Name }}
          {{- if semverCompare ">=1.27-0" $.Capabilities.KubeVersion.Version }}
          matchLabelKeys:
            - pod-template-hash
          {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- $tolerations := .Values.sedaiSmartScheduler.tolerations | default list }}
      {{- $tolerated := list }}
      {{- range $tolerations }}
      {{- if has (.effect | default "") (list "" "NoExecute") }}
      {{- $tolerated = append $tolerated (.key | default "") }}
      {{- end }}
      {{- end }}
      {{- $lostAfter := .Values.sedaiSmartScheduler.nodeLostTolerationSeconds }}
      {{- if or $tolerations $lostAfter }}
      tolerations:
        {{- with $tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and $lostAfter (not (has "" $tolerated)) }}
        {{- range list "node.kubernetes.io/not-ready" "node.kubernetes.io/unreachable" }}
        {{- if not (has . $tolerated) }}
        - key: {{ . }}
          operator: Exists
          effect: NoExecute
          tolerationSeconds: {{ $lostAfter }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
