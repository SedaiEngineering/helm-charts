{{- if or .Values.sedaiGrafanaAlloy.enabled .Values.sedaiVictoriaMetrics.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: server-volume
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    app.kubernetes.io/name: sedai-victoria-metrics
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.sedaiVictoriaMetrics.storageClass }}
  storageClassName: {{ .Values.sedaiVictoriaMetrics.storageClass }}
  {{- end }}
  {{- if .Values.sedaiVictoriaMetrics.persistentVolume.enabled }}
  volumeName: {{ printf "%s-pv-%s" .Values.workload.victoriaMetrics.name .Release.Namespace }}
  {{- end }}
  resources:
    requests:
      storage: "{{ .Values.resources.victoriaMetrics.storage }}"
{{- end }}
