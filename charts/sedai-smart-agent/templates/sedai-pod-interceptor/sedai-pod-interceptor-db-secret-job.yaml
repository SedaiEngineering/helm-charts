{{- if or .Values.sedaiPodInterceptor.enabled .Values.kubeflowSparkOptimization.enabled }}
{{- $dbName := printf "%s-db" .Values.workload.kubeSpecController.name }}
{{- $dbUser := .Values.sedaiPodInterceptor.db.user | default "sedai" }}
{{- $dbDatabase := .Values.sedaiPodInterceptor.db.name | default "sedai_kube_spec_controller_db" }}
{{- $dbPassword := .Values.sedaiPodInterceptor.db.password | default (randAlphaNum 24) }}
---
# Runs before the StatefulSet/Deployment (pre-install/pre-upgrade hook, applied ahead of normal
# resources) and creates the {{ $dbName }} Secret ONLY if it does not already exist. Talks to the
# API server directly with its own ServiceAccount token, so it works regardless of whether the
# tool driving `helm template` (e.g. ArgoCD's repo-server) has live-cluster read access itself.
# Uses only the Python standard library (http.client/ssl/json) against the in-cluster API server,
# via the smart-agent-enroll image (already Python-based and already the chart's convention for
# imperative one-shot API calls) -- deliberately not `kubectl` or busybox's `wget`, since the
# latter's HTTPS support depends on how the specific image was compiled and can't be assumed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $dbName }}-secret-job-script
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
data:
  ensure_db_secret.py: |
    import http.client, ssl, json, os, sys

    ns = os.environ["NAMESPACE"]
    name = os.environ["SECRET_NAME"]
    token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip()
    ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
    conn = http.client.HTTPSConnection("kubernetes.default.svc", 443, context=ctx)
    headers = {"Authorization": f"Bearer {token}"}

    conn.request("GET", f"/api/v1/namespaces/{ns}/secrets/{name}", headers=headers)
    resp = conn.getresponse()
    resp.read()
    if resp.status == 200:
        print(f"Secret {name} already exists in {ns}, leaving it untouched.")
        sys.exit(0)

    print(f"Secret {name} not found in {ns} (status {resp.status}), creating it.")
    body = json.dumps({
        "apiVersion": "v1",
        "kind": "Secret",
        "metadata": {"name": name, "namespace": ns},
        "type": "Opaque",
        "data": {
            "username": os.environ["DB_USER_B64"],
            "password": os.environ["DB_PASSWORD_B64"],
            "dbname": os.environ["DB_NAME_B64"],
        },
    })
    headers["Content-Type"] = "application/json"
    conn.request("POST", f"/api/v1/namespaces/{ns}/secrets", body=body, headers=headers)
    resp = conn.getresponse()
    data = resp.read()
    if resp.status == 409:
        # Lost a create race to a concurrent run (e.g. an overlapping retry) -- the secret
        # exists now regardless of who created it, which is exactly what we want.
        print(f"Secret {name} in {ns} was created concurrently, nothing to do.")
        sys.exit(0)
    if resp.status not in (200, 201):
        print(f"Failed to create secret {name} in {ns}: {resp.status} {data}")
        sys.exit(1)
    print(f"Created secret {name} in {ns}.")
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $dbName }}-secret-job-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $dbName }}-secret-job-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["{{ $dbName }}"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $dbName }}-secret-job-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $dbName }}-secret-job-role
subjects:
  - kind: ServiceAccount
    name: {{ $dbName }}-secret-job-sa
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $dbName }}-secret-job
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
    "helm.sh/hook-weight": "-5"
    {{- with .Values.globalAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: {{ $dbName }}-secret-job
        {{- with .Values.globalLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $dbName }}-secret-job-sa
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.sedaiPodInterceptor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.globalTolerations .Values.sedaiPodInterceptor.tolerations }}
      tolerations:
        {{- with .Values.globalTolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.sedaiPodInterceptor.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: ensure-db-secret
          image: "{{ include "sedai-smart-agent.imageRepository" (dict "globalRegistry" .Values.globalRegistry "repository" .Values.image.smartagentEnroll.repository) }}:{{ .Values.image.smartagentEnroll.imageTag }}"
          imagePullPolicy: "{{ .Values.image.smartagentEnroll.imagePullPolicy }}"
          command: ["python3", "/scripts/ensure_db_secret.py"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET_NAME
              value: {{ $dbName | quote }}
            - name: DB_USER_B64
              value: {{ $dbUser | b64enc | quote }}
            - name: DB_PASSWORD_B64
              value: {{ $dbPassword | b64enc | quote }}
            - name: DB_NAME_B64
              value: {{ $dbDatabase | b64enc | quote }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: {{ $dbName }}-secret-job-script
      {{- with .Values.sedaiPodInterceptor.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
