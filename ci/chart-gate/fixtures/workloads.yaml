# Known workloads the smart agent must report in its discovery round.
apiVersion: v1
kind: Namespace
metadata:
  name: chart-gate-fixtures
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate-fixture-deployment
  namespace: chart-gate-fixtures
spec:
  replicas: 1
  selector:
    matchLabels: {app: gate-fixture-deployment}
  template:
    metadata:
      labels: {app: gate-fixture-deployment}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gate-fixture-statefulset
  namespace: chart-gate-fixtures
spec:
  replicas: 1
  serviceName: gate-fixture-statefulset
  selector:
    matchLabels: {app: gate-fixture-statefulset}
  template:
    metadata:
      labels: {app: gate-fixture-statefulset}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gate-fixture-daemonset
  namespace: chart-gate-fixtures
spec:
  selector:
    matchLabels: {app: gate-fixture-daemonset}
  template:
    metadata:
      labels: {app: gate-fixture-daemonset}
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
