{{- if or .Values.sedaiPodInterceptor.enabled .Values.kubeflowSparkOptimization.enabled }}
# Standalone PVC for the spec-controller Postgres store, NOT a StatefulSet volumeClaimTemplate.
# volumeClaimTemplates are immutable, so growing the store would mean recreating the STS with
# --cascade=orphan; a standalone PVC can be expanded in place (edit spec.resources.requests.storage,
# StorageClass permitting). Single replica keeps the RWO volume single-writer.
{{- $dbName := printf "%s-db" .Values.workload.kubeSpecController.name }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $dbName }}-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    app: {{ $dbName | quote }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
  - ReadWriteOnce
  {{- if .Values.sedaiPodInterceptor.db.persistentVolume.enabled }}
  # Explicit empty string, not an omitted field: an omitted storageClassName lets the API server
  # auto-apply the cluster's default StorageClass (common on EKS Auto Mode/GKE/AKS), which fights
  # with the static volumeName binding below. storageClass is ignored here on purpose - dynamic
  # provisioning and static PV binding are mutually exclusive intents.
  storageClassName: ""
  volumeName: {{ printf "%s-pv-%s" $dbName .Release.Namespace }}
  {{- else if .Values.sedaiPodInterceptor.db.storageClass }}
  storageClassName: {{ .Values.sedaiPodInterceptor.db.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.resources.sedaiPodInterceptorDB.storage | default "2Gi" }}
{{- end }}
