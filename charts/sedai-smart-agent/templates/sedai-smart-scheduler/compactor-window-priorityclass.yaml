{{- $w := .Values.sedaiSmartScheduler.compactor.window }}
{{- if and (eq (include "smart-scheduler.installOk" .) "true") .Values.sedaiSmartScheduler.compactor.enabled (eq (include "smart-scheduler.compactorWindowMode" .) "true") $w.priorityClass.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $w.priorityClass.name }}
  labels:
    {{- include "smart-scheduler.labels" . | nindent 4 }}
value: {{ int64 $w.priorityClass.value }}
preemptionPolicy: {{ $w.priorityClass.preemptionPolicy }}
globalDefault: false
description: "Sedai compactor window Jobs; never preempts other pods."
{{- end }}
