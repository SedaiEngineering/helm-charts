{{- if or .Values.sedaiPodInterceptor.enabled .Values.kubeflowSparkOptimization.enabled }}
# ── Spec-controller store: in-namespace Postgres ─────────────────────────────────────────────
# Chart-managed credentials. The password is generated once and preserved across upgrades via
# lookup (same pattern as the TLS secret), unless an explicit password is set in values.
{{- $dbName := printf "%s-db" .Values.workload.kubeSpecController.name }}
{{- $existingDbSecret := lookup "v1" "Secret" .Release.Namespace $dbName }}
{{- $dbUser := .Values.sedaiPodInterceptor.db.user | default "sedai" }}
{{- $dbDatabase := .Values.sedaiPodInterceptor.db.name | default "sedai_kube_spec_controller_db" }}
{{- $dbPassword := "" }}
{{- if and $existingDbSecret (index $existingDbSecret.data "password") }}
{{- $dbPassword = index $existingDbSecret.data "password" | b64dec }}
{{- else if .Values.sedaiPodInterceptor.db.password }}
{{- $dbPassword = .Values.sedaiPodInterceptor.db.password }}
{{- else }}
{{- $dbPassword = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    app: {{ $dbName | quote }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  username: {{ $dbUser | b64enc }}
  password: {{ $dbPassword | b64enc }}
  dbname: {{ $dbDatabase | b64enc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $dbName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    app: {{ $dbName | quote }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # ClusterIP only — same namespace. Never NodePort/LoadBalancer.
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: {{ $dbName | quote }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $dbName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    app: {{ $dbName | quote }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ $dbName }}
  # Single replica is the accepted v1 posture: the webhook fails open and core is the source of
  # truth, so a store outage is a soft degradation, not a cluster outage.
  replicas: 1
  selector:
    matchLabels:
      app: {{ $dbName | quote }}
  template:
    metadata:
      labels:
        app: {{ $dbName | quote }}
        {{- with .Values.globalLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.globalAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.sedaiPodInterceptor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.globalTolerations .Values.sedaiPodInterceptor.tolerations }}
      tolerations:
        {{- with .Values.globalTolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.sedaiPodInterceptor.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.sedaiPodInterceptor.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        # Run as the postgres uid/gid and make the PVC group-writable so the entrypoint can
        # initialise PGDATA without root. uid/gid 999 matches the Debian-based postgres image
        # pinned in values (postgres:14.6); if the image variant changes, this must change with it.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: postgres
        image: "{{ include "sedai-smart-agent.imageRepository" (dict "globalRegistry" .Values.globalRegistry "repository" .Values.image.sedaiPodInterceptorDB.repository) }}:{{ .Values.image.sedaiPodInterceptorDB.imageTag }}"
        imagePullPolicy: {{ .Values.image.sedaiPodInterceptorDB.imagePullPolicy }}
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ $dbName }}
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ $dbName }}
              key: password
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: {{ $dbName }}
              key: dbname
        - name: PGDATA
          # Subdir of the mount — avoids the lost+found entry at the volume root breaking initdb.
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: "{{ .Values.resources.sedaiPodInterceptorDB.cpu.requests }}"
            memory: "{{ .Values.resources.sedaiPodInterceptorDB.memory.requests }}"
          limits:
            cpu: "{{ .Values.resources.sedaiPodInterceptorDB.cpu.limits }}"
            memory: "{{ .Values.resources.sedaiPodInterceptorDB.memory.limits }}"
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      # The data volume is a standalone PVC (see sedai-pod-interceptor-db-pvc.yaml), NOT a StatefulSet
      # volumeClaimTemplate — a standalone PVC can be expanded in place. Single replica keeps
      # the RWO volume single-writer.
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: {{ $dbName }}-pvc
{{- end }}
