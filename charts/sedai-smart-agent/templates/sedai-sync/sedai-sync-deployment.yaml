{{- if .Values.sedaiSync.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sedai-kube-spec-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    app: "sedai-kube-spec-controller"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "sedai-kube-spec-controller"
  strategy: {}
  template:
    metadata:
      labels:
        app: "sedai-kube-spec-controller"
        {{- with .Values.globalLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.globalAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccount: sedai-kube-spec-controller-sa
      serviceAccountName: sedai-kube-spec-controller-sa

      {{- with .Values.sedaiSync.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if or .Values.globalTolerations .Values.sedaiSync.tolerations }}
      tolerations:
        {{- with .Values.globalTolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.sedaiSync.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      {{- with .Values.sedaiSync.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}

      initContainers:
      - name: init-sqlite-db
        image: "{{ include "sedai-smart-agent.imageRepository" (dict "globalRegistry" .Values.globalRegistry "repository" .Values.image.busyBox.repository) }}:{{ .Values.image.busyBox.imageTag }}"
        command: ["sh", "-c", "chmod 777 {{ .Values.sedaiSync.sqlitePath }} && touch {{ .Values.sedaiSync.sqlitePath }}/sqlite.db && chmod 666 {{ .Values.sedaiSync.sqlitePath }}/sqlite.db"]
        volumeMounts:
          - name: sqlite-data
            mountPath: "{{ .Values.sedaiSync.sqlitePath }}"
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

      containers:
      - name: sedai-kube-spec-controller
        image: "{{ include "sedai-smart-agent.imageRepository" (dict "globalRegistry" .Values.globalRegistry "repository" .Values.image.sedaiSync.repository) }}:{{ .Values.image.sedaiSync.imageTag }}"
        imagePullPolicy: {{ .Values.image.sedaiSync.imagePullPolicy }}
        resources:
          requests:
            cpu: "{{ .Values.resources.sedaiSync.cpu.requests }}"          
            memory: "{{ .Values.resources.sedaiSync.memory.requests }}"
          limits:
            cpu: "{{ .Values.resources.sedaiSync.cpu.limits }}"
            memory: "{{ .Values.resources.sedaiSync.memory.limits }}"
        ports:
        - containerPort: 8443
        env:
        - name: CONFIG_PATH
          value: "/etc/sedai/config"
        - name: CONFIG_NAME
          value: "app-config"
        - name: CONFIG_TYPE
          value: "yaml"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_SSL_CA_PATH
          value: "{{ .Values.sedaiSync.tlsPath }}/ca.crt"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_SSL_CERT_PATH
          value: "{{ .Values.sedaiSync.tlsPath }}/tls.crt"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_SSL_KEY_PATH
          value: "{{ .Values.sedaiSync.tlsPath }}/tls.key"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PORT
          value: "8443"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_SQLITE_DB_PATH
          value: "{{ .Values.sedaiSync.sqlitePath }}/sqlite.db"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_DB_DRIVER_NAME
          value: "{{ .Values.sedaiSync.dbDriver | default "pgx" }}"
        {{- if .Values.sedaiSync.db.enabled }}
        # Shared Postgres store wiring. Present whenever the DB is deployed so the controller can be
        # switched to it by flipping sedaiSync.dbDriver to "pgx" — no other change needed.
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PGSQL_HOST
          value: "sedai-kube-spec-store"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PGSQL_PORT
          value: "{{ .Values.sedaiSync.db.port }}"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PGSQL_DB_NAME
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.sedaiSync.db.existingSecret | default "sedai-kube-spec-store" }}"
              key: "POSTGRES_DB"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PGSQL_USER
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.sedaiSync.db.existingSecret | default "sedai-kube-spec-store" }}"
              key: "POSTGRES_USER"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PGSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.sedaiSync.db.existingSecret | default "sedai-kube-spec-store" }}"
              key: "POSTGRES_PASSWORD"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PGSQL_MAX_OPEN_CONNS
          value: "{{ .Values.sedaiSync.db.maxOpenConns }}"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PGSQL_MAX_IDLE_CONNS
          value: "{{ .Values.sedaiSync.db.maxIdleConns }}"
        - name: SEDAI_KUBE_SPEC_CONTROLLER_PGSQL_CONN_MAX_LIFETIME_MINS
          value: "{{ .Values.sedaiSync.db.connMaxLifetimeMins }}"
        {{- end }}
        - name: ENCODE_LOGS_AS_JSON
          value: "{{ .Values.sedaiSync.encodeLogsAsJson }}"
        - name: CONTAINER_NAME
          value: "sedai-kube-spec-controller"
        - name: AGENT_ACCOUNT_ID
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.workload.smartAgent.secret }}"
              key: "AGENT_ACCOUNTID"
        - name: AGENT_TENANT
          valueFrom:
            secretKeyRef:
              name: "{{ .Values.workload.smartAgent.secret }}"
              key: "AGENT_TENANT"
        volumeMounts:
          - name: certs
            mountPath: "{{ .Values.sedaiSync.tlsPath }}"
            readOnly: true
          - name: sqlite-data
            mountPath: "{{ .Values.sedaiSync.sqlitePath }}"
          - name: dynamic-config-vol
            mountPath: "/etc/sedai/config"
            readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      volumes:
        - name: certs
          secret:
            secretName: sedai-kube-spec-controller-tls
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sedai-kube-spec-controller-pvc
        - name: dynamic-config-vol
          configMap:
            name: sedai-kube-spec-controller-config
{{- end }}