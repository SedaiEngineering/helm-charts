name: Release Charts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'charts/sedai-smart-agent/Chart.yaml'

jobs:
  build:
    name: Sedai Chart Release
    runs-on: sedai-arc-helm-charts
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  # Records the released chart version in the production account's version secret (a different AWS
  # account from the runners). Only the keys in SECRET_KEYS are changed; every other key is carried
  # over as-is. Assumes secrets.PRODUCTION_AWS_ROLE_ARN in that account over OIDC.
  update-version-secret:
    name: Update chart version in Secrets Manager
    needs: build
    runs-on: sedai-arc-helm-charts
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: sedai-smart-agent-version-integration
      cancel-in-progress: false
    env:
      SECRET_ID: arn:aws:secretsmanager:us-east-1:504216784688:secret:sedai-smart-agent-version-integration-7Y2lO6
      SECRET_KEYS: sedai_agent_helm_release_prod sedai_agent_helm_release_default
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The sedai-arc-helm-charts image ships without the AWS CLI and jq; install whichever is
      # missing into the job's temp dir (no root needed).
      - name: Install AWS CLI and jq
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          case "$(uname -m)" in
            x86_64) aws_arch=x86_64; jq_arch=amd64 ;;
            aarch64|arm64) aws_arch=aarch64; jq_arch=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          if ! command -v aws > /dev/null; then
            work=$(mktemp -d "$RUNNER_TEMP/awscli.XXXXXX")
            curl -fsSL -o "$work/awscliv2.zip" "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip"
            if command -v unzip > /dev/null; then
              unzip -q "$work/awscliv2.zip" -d "$work"
            else
              # python's zipfile drops the executable bits, so restore them.
              python3 -m zipfile -e "$work/awscliv2.zip" "$work"
              chmod -R u+x "$work/aws"
            fi
            "$work/aws/install" --install-dir "$RUNNER_TEMP/aws-cli" --bin-dir "$bin"
          fi
          if ! command -v jq > /dev/null; then
            curl -fsSL -o "$bin/jq" "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-${jq_arch}"
            chmod +x "$bin/jq"
          fi
          PATH="$bin:$PATH" aws --version
          PATH="$bin:$PATH" jq --version

      - name: Configure AWS Credentials for the production account
        uses: aws-actions/configure-aws-credentials@v5.0.0
        with:
          role-to-assume: ${{ secrets.PRODUCTION_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set ${{ env.SECRET_KEYS }} to the chart version
        run: |
          set -euo pipefail
          VERSION=$(grep -E "^version:" charts/sedai-smart-agent/Chart.yaml | awk '{print $2}')
          echo "Chart version: $VERSION"

          tmp=$(mktemp -d "$RUNNER_TEMP/secret.XXXXXX")
          trap 'rm -rf "$tmp"' EXIT
          aws secretsmanager get-secret-value --secret-id "$SECRET_ID" \
            --query SecretString --output text > "$tmp/current.json"

          if ! jq -e 'type == "object"' "$tmp/current.json" > /dev/null; then
            echo "::error::secret value is not a JSON object; refusing to change it"
            exit 1
          fi

          keys=$(jq -cn --arg ks "$SECRET_KEYS" '$ks | split(" ") | map(select(. != ""))')
          jq -c --argjson ks "$keys" --arg v "$VERSION" 'reduce $ks[] as $k (.; .[$k] = $v)' \
            "$tmp/current.json" > "$tmp/updated.json"
          if jq -e -n --slurpfile a "$tmp/current.json" --slurpfile b "$tmp/updated.json" '$a[0] == $b[0]' > /dev/null; then
            echo "$SECRET_KEYS already $VERSION"
            exit 0
          fi
          # Every other key must be unchanged.
          jq -e -n --argjson ks "$keys" --slurpfile a "$tmp/current.json" --slurpfile b "$tmp/updated.json" \
            '($a[0] | delpaths($ks | map([.]))) == ($b[0] | delpaths($ks | map([.])))' > /dev/null

          aws secretsmanager put-secret-value --secret-id "$SECRET_ID" \
            --secret-string "file://$tmp/updated.json" > /dev/null
          for k in $SECRET_KEYS; do
            echo "$k: '$(jq -r --arg k "$k" '.[$k] // ""' "$tmp/current.json")' -> '$VERSION'"
          done
