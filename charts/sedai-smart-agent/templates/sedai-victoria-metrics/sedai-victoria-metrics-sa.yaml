{{- if or .Values.sedaiGrafanaAlloy.enabled (eq (include "victoria-metrics.enabled" .) "true") }}
---
# Source: victoria-metrics-single/templates/serviceaccount.yaml 
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    {{- include "sedai-smart-agent.componentLabels" . | nindent 4 }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    app.kubernetes.io/name: sedai-victoria-metrics
    app.kubernetes.io/component: rbac
  name: {{ .Values.workload.victoriaMetrics.name }}
  namespace: {{ .Release.Namespace }}
{{- if and .Values.imagePullSecret.enabled .Values.imagePullSecret.secretName }}
imagePullSecrets:
  - name: "{{ .Values.imagePullSecret.secretName }}"
{{- end }}
{{- end }}
