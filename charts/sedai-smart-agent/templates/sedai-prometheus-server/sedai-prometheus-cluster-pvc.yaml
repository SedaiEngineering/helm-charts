{{- if .Values.sedaiPrometheus.enabled }}

---
# Source: sedai-smart-agent-chart/charts/sedai-prometheus/templates/pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: "{{ .Values.workload.prometheus.name }}-pvc"
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.sedaiPrometheus.persistentVolume.enabled }}
  # Explicit empty string, not an omitted field: an omitted storageClassName lets the API server
  # auto-apply the cluster's default StorageClass (common on EKS Auto Mode/GKE/AKS), which fights
  # with the static volumeName binding below. storageClass is ignored here on purpose - dynamic
  # provisioning and static PV binding are mutually exclusive intents.
  storageClassName: ""
  volumeName: {{ printf "%s-pv-%s" .Values.workload.prometheus.name .Release.Namespace }}
  {{- else if .Values.sedaiPrometheus.storageClass }}
  storageClassName: {{ .Values.sedaiPrometheus.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: "{{ .Values.resources.prometheus.storage }}"

{{- end }}