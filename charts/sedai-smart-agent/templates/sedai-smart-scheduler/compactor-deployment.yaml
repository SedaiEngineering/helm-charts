{{- if and (eq (include "smart-scheduler.installOk" .) "true") .Values.sedaiSmartScheduler.compactor.enabled (ne (include "smart-scheduler.compactorWindowMode" .) "true") -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.workload.smartCompactor.name | default "sedai-smart-compactor" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "smart-scheduler.labels" . | nindent 4 }}
    app: sedai-smart-compactor
spec:
  replicas: {{ .Values.sedaiSmartScheduler.compactor.replicas }}
  selector:
    matchLabels:
      app: sedai-smart-compactor
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: sedai-smart-compactor
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/sedai-smart-scheduler/compactor-configmap.yaml") . | sha256sum }}
        {{- if .Values.sedaiSmartScheduler.compactor.disruptionProtection }}
        karpenter.sh/do-not-disrupt: "true"
        {{- end }}
    spec:
      {{- include "smart-scheduler.compactorPodSpec" (dict "root" . "window" false) | nindent 6 }}
{{- end }}
