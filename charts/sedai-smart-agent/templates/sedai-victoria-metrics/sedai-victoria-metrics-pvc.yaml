{{- if or .Values.sedaiGrafanaAlloy.enabled .Values.sedaiVictoriaMetrics.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: server-volume
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    app.kubernetes.io/name: sedai-victoria-metrics
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.sedaiVictoriaMetrics.persistentVolume.enabled }}
  # Explicit empty string, not an omitted field: an omitted storageClassName lets the API server
  # auto-apply the cluster's default StorageClass (common on EKS Auto Mode/GKE/AKS), which fights
  # with the static volumeName binding below. storageClass is ignored here on purpose - dynamic
  # provisioning and static PV binding are mutually exclusive intents.
  storageClassName: ""
  volumeName: {{ printf "sedai-victoria-metrics-pv-%s" .Release.Namespace }}
  {{- else if .Values.sedaiVictoriaMetrics.storageClass }}
  storageClassName: {{ .Values.sedaiVictoriaMetrics.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: "{{ .Values.resources.victoriaMetrics.storage }}"
{{- end }}
