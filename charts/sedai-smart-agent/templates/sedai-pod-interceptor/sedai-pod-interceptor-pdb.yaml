{{- if and (or .Values.sedaiPodInterceptor.enabled .Values.kubeflowSparkOptimization.enabled) .Values.sedaiPodInterceptor.disruptionProtection }}
{{- $dbName := printf "%s-db" .Values.workload.kubeSpecController.name }}
# Both PDBs use minAvailable:1, the only correct shape for a single-replica pod (maxUnavailable:1
# would allow evicting the sole replica, since 0 remaining still satisfies "at most 1 unavailable").
# See sedaiPodInterceptor.disruptionProtection in values.yaml for the node-drain caveat this implies.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.workload.kubeSpecController.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    app: "{{ .Values.workload.kubeSpecController.name }}"
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: "{{ .Values.workload.kubeSpecController.name }}"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $dbName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    app: {{ $dbName | quote }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $dbName | quote }}
{{- end }}
