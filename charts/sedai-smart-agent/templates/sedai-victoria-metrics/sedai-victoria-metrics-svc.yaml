{{- if or .Values.sedaiGrafanaAlloy.enabled (eq (include "victoria-metrics.enabled" .) "true") }}
---
# Source: victoria-metrics-single/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.componentLabels" . | nindent 4 }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    app.kubernetes.io/name: sedai-victoria-metrics
    app.kubernetes.io/component: networking
    app: server
  name: {{ .Values.workload.victoriaMetrics.name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8428
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: sedai-victoria-metrics
    app: server
{{- end }}
