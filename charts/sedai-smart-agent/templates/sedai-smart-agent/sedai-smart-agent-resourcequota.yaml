# Some clusters (e.g. GKE with a LimitedResources admission policy) reject any pod using
# system-cluster-critical/system-node-critical unless a matching ResourceQuota already exists in
# the namespace, regardless of that quota's remaining capacity. The core smart-agent Deployment
# is unconditional (see sedai-smart-agent-deployment.yaml), but only actually needs this quota
# when workload.smartAgent.priorityClassName is set to one of those two classes - if it's left
# empty (see sedai-smart-agent-deployment.yaml's `with`), the Deployment carries no
# priorityClassName at all and this quota would just be dead weight in the namespace.
{{- if .Values.workload.smartAgent.priorityClassName }}
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sedai-smart-agent-allow-critical-priority
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sedai-smart-agent.labels" . | nindent 4 }}
    {{- with .Values.globalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.globalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scopeSelector:
    matchExpressions:
    - scopeName: PriorityClass
      operator: In
      values:
      - system-cluster-critical
      - system-node-critical
  hard:
    pods: "50"
{{- end }}
